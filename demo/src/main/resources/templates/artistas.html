<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Artistas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .error { color: #b00020; }
    </style>
</head>
<body>
    <h1>Artistas</h1>
    <p><a href="/canciones">← Volver a canciones</a></p>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/artistas/guardar}" th:object="${artista}" method="post">
        <input type="text" th:field="*{nombre}" placeholder="Nombre" required>
        <input type="text" th:field="*{nacionalidad}" placeholder="Nacionalidad">
        <button type="submit">Agregar artista</button>
    </form>

    <table>
        <tr><th>ID</th><th>Nombre</th><th>Nacionalidad</th></tr>
        <tr th:each="a : ${artistas}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.nombre}"></td>
            <td th:text="${a.nacionalidad}"></td>
        </tr>
    </table>
</body>
</html>
